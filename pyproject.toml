[project]
name = "astrbot-plugin-lofter"
version = "2.0.20"
description = "AstrBot 插件：解析/订阅 Lofter 内容"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
    "lftr==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-dotenv>=0.5",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
