name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.10"
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      - run: uv run --frozen pytest -q -m "not real and not adapter_contract"

  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --group dev --group adapter-contract
      - run: uv run --frozen --group dev --group adapter-contract python -c "import astrbot, aiocqhttp"
      - run: uv run --frozen --group dev --group adapter-contract pytest -q -m adapter_contract tests/test_napcat_adapter_contract.py
